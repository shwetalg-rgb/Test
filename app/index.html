<title>Gennext Events</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mukta+Vaani:wght@400;500;600;700&display=swap">
<style>
/* Layout: quiet sidebar shell on laptop, bottom tab bar on phone; content in calm sheets with saffron used only for action and "now". */
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --sunk:#EFEDE6; --line:#E2DFD5;
  --ink:#24233A; --ink-2:#5D5B70; --ink-3:#8C8A9B;
  --saffron:#D9791A; --saffron-soft:#FBEBD8; --gold:#A8812E; --gold-soft:#F3EAD3;
  --indigo:#3B3A6B; --indigo-soft:#E6E5F2;
  --ok:#2F7D57; --ok-soft:#DDF0E5; --warn:#B7791F; --warn-soft:#FBF0D9; --bad:#B4413A; --bad-soft:#F8E1DE;
  --f-display:"Marcellus", "Cormorant Garamond", Georgia, serif;
  --f-body:"Mukta Vaani", "Noto Sans Gujarati", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(36,35,58,.06), 0 6px 20px rgba(36,35,58,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17161F; --surface:#201F2B; --sunk:#2A2937; --line:#363546;
  --ink:#EEEDF4; --ink-2:#B7B5C6; --ink-3:#8A889B;
  --saffron:#F0963C; --saffron-soft:#3D2A17; --gold:#D4B064; --gold-soft:#352D1B;
  --indigo:#A9A7E8; --indigo-soft:#2C2B47;
  --ok:#5CC08C; --ok-soft:#1C3328; --warn:#E3AE4F; --warn-soft:#382D16; --bad:#EE7D74; --bad-soft:#3A1F1D;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#17161F; --surface:#201F2B; --sunk:#2A2937; --line:#363546;
  --ink:#EEEDF4; --ink-2:#B7B5C6; --ink-3:#8A889B;
  --saffron:#F0963C; --saffron-soft:#3D2A17; --gold:#D4B064; --gold-soft:#352D1B;
  --indigo:#A9A7E8; --indigo-soft:#2C2B47;
  --ok:#5CC08C; --ok-soft:#1C3328; --warn:#E3AE4F; --warn-soft:#382D16; --bad:#EE7D74; --bad-soft:#3A1F1D;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:1.9rem;line-height:1.15} h2{font-size:1.35rem} h3{font-size:1.08rem}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-weight:400;font-size:1.25rem;display:block;line-height:1.1}
.brand small{color:var(--ink-3);font-size:.75rem}
.nav-label{padding:14px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink-2);text-decoration:none;cursor:pointer;font-weight:500}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a.on{background:var(--saffron-soft);color:var(--ink)}
.nav a.on svg{color:var(--saffron)}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);display:grid;gap:10px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.topbar .crumb{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .sp{flex:1}
.content{padding-block:24px 110px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1240px;width:100%;display:grid;gap:22px}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:4px 11px;border-radius:999px;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabbar{display:none}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--saffron);border-color:var(--saffron);color:#fff}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn svg{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--ink-2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.sf{background:var(--saffron-soft);color:var(--saffron)} .pill.in{background:var(--indigo-soft);color:var(--indigo)} .pill.gd{background:var(--gold-soft);color:var(--gold)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.field{display:grid;gap:4px} .field label{font-size:.8rem;font-weight:600;color:var(--ink-2)}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:80px}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--saffron);border-radius:99px}
.bar.ok>i{background:var(--ok)} .bar.bad>i{background:var(--bad)} .bar.gd>i{background:var(--gold)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td input[type=date],td select{padding:3px 6px;font-size:.84rem;width:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--saffron)}
.empty{padding:28px;text-align:center;color:var(--ink-3)}
.note{background:var(--indigo-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:.86rem;display:flex;gap:8px;align-items:flex-start}
.note svg{flex:none;color:var(--indigo);width:18px;height:18px;margin-top:2px}

/* home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.next{position:relative;overflow:hidden;background:var(--indigo);color:#fff;border-radius:16px;padding:24px;display:grid;gap:14px;min-height:210px}
.next .eyebrow{color:rgba(255,255,255,.7)}
.next h2{font-size:1.8rem}
.next .big{font-family:var(--f-display);font-size:3.2rem;line-height:1}
.next .bar{background:rgba(255,255,255,.18)} .next .bar>i{background:var(--gold)}
.next svg.mandala{position:absolute;right:-60px;top:-60px;width:260px;height:260px;opacity:.13;color:#fff}
:root[data-theme="dark"] .next{background:#2E2D55} @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .next{background:#2E2D55}}
.evcard{display:grid;gap:10px;cursor:pointer;transition:border-color .15s}
.evcard:hover{border-color:var(--saffron)}
.evtag{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-size:1rem;flex:none}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--ink-3);background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chk svg{width:13px;height:13px}
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mini{aspect-ratio:1;border-radius:10px;max-width:100%;position:relative;overflow:hidden}

/* moments */
.wall{columns:4 220px;column-gap:14px}
.moment{break-inside:avoid;margin-bottom:14px;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.moment .ph{position:relative;display:block;width:100%}
.moment img{display:block;width:100%}
.moment .cap{padding:10px 12px}
.art{position:relative;overflow:hidden;width:100%}
.art span{position:absolute;inset:auto 10px 8px 10px;color:#fff;font-family:var(--f-display);font-size:1rem;text-shadow:0 1px 6px rgba(0,0,0,.35)}

/* board / calendar */
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;font-size:.88rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .dh{background:var(--sunk);padding:6px 8px;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.cal .d{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .d.out{background:var(--bg)} .cal .d.out .n{color:var(--ink-3)}
.cal .d.today .n{background:var(--saffron);color:#fff;border-radius:99px;padding:0 7px}
.cal .n{font-size:.8rem;font-weight:600;align-self:flex-start}
.cal .it{font-size:.72rem;padding:1px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal .it.ev{background:var(--indigo);color:#fff}
.cal .it.tk{background:var(--saffron-soft);color:var(--ink)}
.cal .it.tk.done{background:var(--sunk);color:var(--ink-3);text-decoration:line-through}

/* library */
.folder{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.folder:hover{border-color:var(--gold)}
.folder svg{color:var(--gold);width:28px;height:28px;flex:none}
.file{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.file .art{aspect-ratio:4/3}
.file .meta{padding:8px 10px;font-size:.84rem;display:grid;gap:4px}

/* checker */
.drop{border:2px dashed var(--line);border-radius:14px;padding:24px;text-align:center;cursor:pointer;display:grid;gap:8px;place-items:center;background:var(--surface)}
.drop:hover{border-color:var(--saffron)}
.drop img{max-height:280px;border-radius:8px}
.res{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.ri{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,19,30,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;width:min(640px,100%);max-height:90vh;overflow:auto;padding:22px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{width:min(860px,100%)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:60;font-weight:600;font-size:.88rem}

/* public submit */
.public{max-width:560px;margin:0 auto;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}

.report{border:1px solid var(--line);border-radius:10px;padding:22px;display:grid;gap:14px;background:var(--surface)}
.report table td,.report table th{padding:6px 8px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .hero{grid-template-columns:1fr}
  .topbar,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a{flex:1;display:grid;justify-items:center;gap:2px;font-size:.7rem;color:var(--ink-3);text-decoration:none;cursor:pointer;font-weight:600}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a.on{color:var(--saffron)}
  h1{font-size:1.55rem}
  .next .big{font-size:2.6rem}
  .topbar .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ---------- icons ---------- */
const I={
home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
events:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 15l2 2 4-4"/>',
cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
money:'<rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="3"/><path d="M6 10v.01M18 15v.01"/>',
budget:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
idea:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',
moment:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
lib:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
guide:'<path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5M8 13h8M8 17h5"/>',
tpl:'<path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="16" r="3"/>',
more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
check:'<path d="M5 12l5 5 9-10"/>',
info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>',
up:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',
link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
back:'<path d="M15 6l-6 6 6 6"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',
file:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',
};
const ic=(n,s='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${s}>${I[n]}</svg>`;
const MANDALA='<svg class="mandala" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="1.2">'+Array.from({length:12},(_,i)=>`<ellipse cx="100" cy="55" rx="16" ry="45" transform="rotate(${i*30} 100 100)"/>`).join('')+'<circle cx="100" cy="100" r="22"/><circle cx="100" cy="100" r="92"/></svg>';

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const TODAY=iso(new Date());
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=s=>{if(!s)return '—';const d=parse(s);return `${d.getDate()} ${MON[d.getMonth()]}`};
const fmtY=s=>{if(!s)return '—';const d=parse(s);return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`};
const inr=n=>'₹'+Math.round(n||0).toLocaleString('en-IN');
const uid=()=>Math.random().toString(36).slice(2,9);
const evDates=e=>e.end&&e.end!==e.date?`${fmt(e.date)} – ${fmtY(e.end)}`:fmtY(e.date);
const dLabel=o=>o===0?'D-day':o<0?`D${o}`:`D+${o}`;

/* ---------- reference data ---------- */
const TEAM=['Shweta','Saransh','Anjal','Natasha','Shriya','Devanshi','Shraddha','Chirag','Achira','Param'];
const DEPTS=['Marketing - Social','Marketing - Information','Design','Printables','Operations','Procurement','Programming','Leadership Update'];
const STATUSES=['To start','WIP','Live','Closed'];
const STCLS={'To start':'','WIP':'warn','Live':'in','Closed':'ok'};
const TYPES={
 smilescapes:{label:'Smilescapes',short:'SS',color:'#3E8EC9',where:'Mumbai & beyond',runway:15},
 prem:{label:'Prem Mahotsav',short:'PM',color:'#C2564B',where:'RC, Khopoli',runway:90},
 anand:{label:'Anand Mahotsav',short:'AM',color:'#D9791A',where:'RC, Khopoli',runway:90},
 sarvarpan:{label:'Sarvarpan Divas',short:'SD',color:'#7A6BB0',where:'RC, Khopoli',runway:90},
 guru:{label:'Guru Purnima',short:'GP',color:'#A8812E',where:'RC, Khopoli',runway:90},
 paryushan:{label:'Paryushan',short:'PY',color:'#2F7D57',where:'RC, Khopoli',runway:90},
 rpl:{label:'RPL',short:'RPL',color:'#2C6E8F',where:'RC, Khopoli',runway:45},
};
/* row: [title, dept, collateral, ext/int, lead1, lead2, offset] */
const SS_ROWS=[
 ['References for reels and stories','Marketing - Social','Reels + Story','External','Saransh','Anjal',-13],
 ['Registration open','Marketing - Social','Reel','External','Saransh','Anjal',-13],
 ['Location recce','Operations','Google pin + pictures','Internal','Shweta','Shriya',-11],
 ['People experience – video montage','Marketing - Social','Reel','External','Saransh','Devanshi',-11],
 ['Participant list for Pujya Nileshbhai','Leadership Update','Excel / PDF','Internal','Shweta','Anjal',-10],
 ['Event experience – Smilescapes is calling','Marketing - Social','Reel','External','Saransh','Shraddha',-10],

const done=x=>x.st==='Closed'||x.st==='Live';

const ME=()=>isAdmin()?'Shweta':'Anjal';
const upcoming=()=>S.events.filter(e=>e.date>=TODAY).sort((a,b)=>a.date<b.date?-1:1);
const evTag=(e,size=38)=>`<div class="evtag" style="width:${size}px;height:${size}px;background:${TYPES[e.type].color}22;color:${TYPES[e.type].color}">${TYPES[e.type].short}</div>`;
const art=(hue,label,ratio)=>`<div class="art" style="aspect-ratio:${ratio||'4/3'};background:radial-gradient(circle at 30% 25%,hsl(${hue} 70% 78%),transparent 60%),linear-gradient(150deg,hsl(${hue} 55% 55%),hsl(${(hue+40)%360} 45% 32%))">${label?`<span>${esc(label)}</span>`:''}</div>`;

function reportRows(){const A=S.annual;const secOf=l=>l.sec||verts().indexOf(l.vertical)+1;const secs=[...new Set(A.lines.map(secOf))].sort((a,b)=>a-b);

  for(const sn of secs){const ls=A.lines.filter(l=>secOf(l)===sn);let t={fy26:0,act:0,plan:0,used:0};let pv='',pn='';
    ls.forEach(l=>{const u=usedOf(l);out.push({k:'line',sn:pv?'':sn,v:l.vertical===pv?'':l.vertical,n:l.nature==='—'||l.nature===pn?'':l.nature,item:l.item,freq:l.freq,fy26:l.fy26,act:l.fy26act,plan:l.approved,unit:l.qty?`${l.qty.toLocaleString('en-IN')} ${l.unitLbl}`:'',per:l.unit||'',used:u,rem:l.approved-u});pv=l.vertical;pn=l.nature;
      t.fy26+=l.fy26;t.act+=l.fy26act;t.plan+=l.approved;t.used+=u});
    if(A.secAct&&A.secAct[sn]!=null)t.act=A.secAct[sn];
    out.push({k:'tot',item:`TOTAL SECTION ${sn}`,...t,rem:t.plan-t.used});for(const k in g)g[k]+=t[k]}
  out.push({k:'grand',item:'GRAND TOTAL',...g,rem:g.plan-g.used});return out}

async function downloadBudget(){const msg=$('dlmsg');if(typeof XLSX==='undefined'){msg.textContent='The spreadsheet tool did not load. Reload the page and try again.';return}
  const A=S.annual,{appr,planned,used,un}=annualTotals(),R=reportRows();

   ['S No','Vertical','Nature Of Expense','Line Items / Project','Frequency','FY2025-26 Total Approved (INR)','FY2025-26 Actual Expense (INR)','FY2026-27 Proposed Plan (INR)','Unit','Per Unit Cost (INR)','FY2026-27 Actual Used to Date (INR)','FY2026-27 Remaining (INR)']];
  for(const r of R)sum.push(r.k==='line'?[r.sn,r.v,r.n,r.item,r.freq,r.fy26,r.act,r.plan,r.unit,r.per,r.used,r.rem]:['','','',r.item,'',r.fy26,r.act,r.plan,'','',r.used,r.rem]);
  sum.push([],['','','','Total Ask','','','',planned],['','','','Approved','','','',appr,'','',used,appr-used]);

  for(const l of A.lines){for(const p of planOf(l)){const u=piUsed(p);br.push([l.vertical,l.nature,l.item,mLabel(p.month),p.title,(evById(p.ev)||{}).name||'',p.qty||'',p.unit||'',p.amt,u,p.amt-u])}
    const lo=expOf(l).filter(x=>!piOf(x)).reduce((a,b)=>a+b.amt,0);if(lo)br.push([l.vertical,l.nature,l.item,'','Expenses not linked to a planned spend','','','','',lo,'']);
    const pl=planOf(l).reduce((a,b)=>a+b.amt,0);br.push(['','',`Total – ${l.item} (approved ${l.approved})`,'','','','','',pl,usedOf(l),pl-usedOf(l)],[])}
  const ex=[['Date','Event','Expense','Budget Head','Vendor','Paid By','Quoted (INR)','Actual (INR)','Budget Line','Planned Spend','Bill Available','Bill File']];
  for(const x of [...S.expenses].sort((a,b)=>a.date<b.date?-1:1)){const l=lineOf(x),p=piOf(x);ex.push([x.date,(evById(x.ev)||{}).name||'',x.item,x.head,vName(x.vendor)==='—'?'':vName(x.vendor),x.by,x.quote||'',x.amt,l?`${l.vertical} · ${l.item}`:(x.line==='none'?'Not from annual budget':'Not assigned'),p?`${mLabel(p.month)} · ${p.title}`:'',x.bill?'Yes':'No',x.file||''])}
  const wb=XLSX.utils.book_new();const add=(rows,name,w)=>{const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=w.map(c=>({wch:c}));XLSX.utils.book_append_sheet(wb,ws,name)};
  add(sum,'Budget Summary',[6,20,20,34,18,16,16,16,14,12,18,16]);add(br,'Line-wise Breakdown',[20,20,30,9,40,30,8,10,12,12,12]);add(ex,'Expenses',[11,30,34,22,22,12,12,12,34,32,10,22]);
  const data=XLSX.write(wb,{bookType:'xlsx',type:'array'});const fn=`Gennext Budget Summary FY${A.fy} (as on ${TODAY}).xlsx`;
  const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
  if(!dl){msg.textContent='Downloads are not available in this view. Open the page in claude.ai to download.';return}

function saveMoment(){const f=$('mf').files[0];const fin=img=>{S.moments.unshift({id:uid(),cap:$('mc').value||'A lovely moment',ev:$('me').value,by:ME(),hue:Math.floor(Math.random()*360),h:1,ok:false,img});closeModal();save();render();toast(isAdmin()?'Posted. Approve it below':'Sent for approval')};
  if(f){const r=new FileReader();r.onload=()=>shrink(r.result,900,fin);r.readAsDataURL(f)}else fin('')}
function shrink(src,max,cb){const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};im.onerror=()=>cb('');im.src=src}
function approve(id,ok){if(ok)S.moments.find(m=>m.id===id).ok=true;else S.moments=S.moments.filter(m=>m.id!==id);save();render()}

  let body='';
  if(libQ){const hits=[];for(const [ev,ys] of Object.entries(L))for(const [y,fs] of Object.entries(ys))for(const f of fs)if((ev+' '+y+' '+f[0]+' '+f[1]).toLowerCase().includes(libQ.toLowerCase()))hits.push([ev,y,f]);
    body=`<div class="grid g3">${hits.map(([ev,y,f])=>fileTile(f,ev,y)).join('')||'<div class="empty">Nothing found.</div>'}</div>`}
  else if(libPath.length===0){body=`<div class="grid g3">${Object.entries(L).map(([ev,ys])=>`<div class="folder" onclick="libPath=['${esc(ev)}'];render()">${ic('lib')}<div><b>${esc(ev)}</b><div class="faint" style="font-size:.8rem">${Object.keys(ys).length} year(s) · ${Object.values(ys).flat().length} items</div></div></div>`).join('')}</div>`}
  else if(libPath.length===1){const ys=L[libPath[0]]||{};body=`<div class="grid g3">${Object.entries(ys).sort((a,b)=>a[0]<b[0]?1:-1).map(([y,fs])=>`<div class="folder" onclick="libPath=['${esc(libPath[0])}','${y}'];render()">${ic('lib')}<div><b>${y}</b><div class="faint" style="font-size:.8rem">${fs.length} items</div></div></div>`).join('')}</div>`}
  else {const fs=(L[libPath[0]]||{})[libPath[1]]||[];body=`<div class="seg" style="justify-self:start">${['','Photo','Creative','Logo'].map(k=>`<button class="${libKind===k?'on':''}" onclick="libKind='${k}';render()">${k||'All'}</button>`).join('')}</div>
    <div class="grid g3">${fs.filter(f=>!libKind||f[1]===libKind).map(f=>fileTile(f,libPath[0],libPath[1])).join('')}</div>`}
  return `<div class="row between"><div><div class="eyebrow">Photos · logos · past creatives</div><h1>${t('Library')}</h1></div><button class="btn pri" onclick="toast('Uploads go to the matching Drive folder once connected')">${ic('up')}Upload</button></div>
  <div class="note">${ic('info')}<div><b>Connected to Google Drive.</b> Files stay in your shared Drive (Event → Year). The app indexes and tags them so they are easy to search and preview. <span class="faint">(Sample folders shown. The live connection comes in the backend phase.)</span></div></div>
  <input type="search" id="libq" placeholder="Search e.g. “Prem Mahotsav key visual 2025” or “logo white”" value="${esc(libQ)}" oninput="libQ=this.value;render();setTimeout(()=>{const i=$('libq');i.focus();i.setSelectionRange(i.value.length,i.value.length)})">
  ${libQ?'':`<div class="row" style="gap:2px">${crumbs}</div>`}${body}`;
};
const fileTile=(f,ev,y)=>`<div class="file">${art(f[2],f[1]==='Logo'?f[0]:'')}<div class="meta"><b>${esc(f[0])}</b><div class="row between"><span class="faint">${esc(ev)} · ${esc(y)}</span><span class="pill ${f[1]==='Creative'?'sf':f[1]==='Logo'?'gd':'in'}">${f[1]}</span></div></div></div>`;

/* guidelines + checker */
let gTab='rules', chkImg='', chkRes=null, chkEv='Smilescapes', chkFmt='Instagram post';
V.guidelines=()=>{
  let body='';
  if(gTab==='rules'){const cats=[...new Set(S.rules.map(r=>r.cat))];
    body=cats.map(c=>`<div class="grid" style="gap:8px"><h3>${esc(c)}</h3>${S.rules.filter(r=>r.cat===c).map(r=>`<div class="card row" style="flex-wrap:nowrap;align-items:flex-start;padding:12px 14px"><span style="color:var(--gold)">${ic('check','style="width:18px;height:18px"')}</span><div style="flex:1">${esc(r.text)}</div>${isAdmin()?`<button class="btn ghost sm" onclick="delRule('${r.id}')">Remove</button>`:''}</div>`).join('')}</div>`).join('')+
    (isAdmin()?`<div class="card grid" style="gap:8px"><h3>Add a guideline</h3><div class="row"><input type="text" id="rcat" placeholder="Category (Logo, Colour…)" style="width:200px"><input type="text" id="rtext" placeholder="The rule" style="flex:1;min-width:220px"><button class="btn pri" onclick="addRule()">Add</button></div></div>`:'')}
  else {
    body=`<div class="grid g2" style="align-items:start">
    <div class="grid" style="gap:12px">
      <label class="drop" for="cfile">${chkImg?`<img src="${chkImg}" alt="Creative to check">`:`${ic('up','style="width:32px;height:32px;color:var(--saffron)"')}<b>Drop a creative here or tap to upload</b><span class="faint">PNG or JPG: posts, stories, banners</span>`}</label>
      <input type="file" id="cfile" accept="image/*" hidden onchange="loadChk(this)">
      <div class="grid g2" style="gap:10px"><div class="field"><label for="cev">Event</label><select id="cev" onchange="chkEv=this.value">${['Smilescapes',...Object.values(TYPES).filter(x=>x.label!=='Smilescapes').map(x=>x.label)].map(x=>`<option ${x===chkEv?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label for="cfmt">Format</label><select id="cfmt" onchange="chkFmt=this.value">${['Instagram post','Instagram story','WhatsApp creative','Print banner'].map(x=>`<option ${x===chkFmt?'selected':''}>${x}</option>`).join('')}</select></div></div>
      <button class="btn pri" ${chkImg?'':'disabled style="opacity:.5"'} onclick="runChk()">Check against ${S.rules.length} guidelines</button>
    </div>
    <div class="card">${chkRes?resView():`<div class="empty">Upload a creative to see which guidelines it follows and what to fix.</div>`}</div></div>`;
  }
  return `<div><div class="eyebrow">For everyone who makes creatives</div><h1>${t('Creative guidelines')}</h1></div>
  <div class="tabs">${[['rules','Guidelines'],['check','Check a creative']].map(x=>`<button class="${gTab===x[0]?'on':''}" onclick="gTab='${x[0]}';render()">${x[1]}</button>`).join('')}</div>${body}`;
};
function addRule(){const tx=$('rtext').value.trim();if(!tx)return;S.rules.push({id:uid(),cat:$('rcat').value.trim()||'General',text:tx});save();render()}
function delRule(id){S.rules=S.rules.filter(r=>r.id!==id);save();render()}
function loadChk(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>shrink(r.result,900,u=>{chkImg=u;chkRes=null;render()});r.readAsDataURL(f)}
function runChk(){chkRes='loading';render();setTimeout(()=>{
  const verdicts={'Logo':['pass','RC logo found top-left with good clear space.'],'Colour':['review','Background is close to PS blue but slightly lighter. Confirm against the key visual.'],'Typography':['pass','Two typefaces used; headline is about 2.6× body size.'],'Mandatory info':['fail','Date and venue found. Registration link or QR is missing.'],'Imagery':['pass','Photo matches an approved Library image.'],'Tone':['pass','Warm, inviting copy. No hard-sell words found.'],'Language':['review','"Smilescape" appears without the final "s" once. Check spelling.']};
  chkRes=S.rules.map(r=>{const v=verdicts[r.cat]||['review','Needs a human look.'];return {r,v:v[0],why:v[1]}});
  // second logo rule
  chkRes.forEach(x=>{if(/lockup/.test(x.r.text)){x.v=chkEv==='Smilescapes'?'pass':'na';x.why=chkEv==='Smilescapes'?'"Smilescapes by Project Smilestones" lockup present bottom-right.':'Not applicable to this event.'}});
  render()},1400)}
function resView(){if(chkRes==='loading')return `<div class="empty">Reading the creative and checking each guideline…</div>`;
  const c={pass:0,fail:0,review:0};chkRes.forEach(x=>c[x.v]!==undefined&&c[x.v]++);
  const st={pass:['✓','ok'],fail:['✕','bad'],review:['!','warn'],na:['–','']};
  return `<div class="grid" style="gap:10px"><div class="row between"><h3>Result</h3><span class="pill">Demo result</span></div>
  <div class="row"><span class="pill ok">${c.pass} passed</span><span class="pill bad">${c.fail} to fix</span><span class="pill warn">${c.review} to review</span></div>
  <div>${chkRes.map(x=>`<div class="res"><span class="ri" style="background:var(--${st[x.v][1]||'sunk'}-soft,var(--sunk));color:var(--${st[x.v][1]||'ink-3'})">${st[x.v][0]}</span><div><b style="font-size:.9rem">${esc(x.r.cat)}</b> <span class="muted" style="font-size:.86rem">· ${esc(x.r.text)}</span><div style="font-size:.88rem;margin-top:2px">${esc(x.why)}</div></div></div>`).join('')}</div>
  <div class="note">${ic('info')}<div>Prototype: these findings are sample output. In the full app, AI reads the creative and checks it against your live guidelines.</div></div></div>`}

/* templates */
let tplType='smilescapes';
V.templates=()=>{
  if(!isAdmin()) return V.home();
  const rows=[...S.tpl[tplType]].sort((a,b)=>a.o-b.o);
  return `<div><div class="eyebrow">Admin · back-calculation norms</div><h1>${t('Templates')}</h1></div>
  <div class="note">${ic('info')}<div>Each event type has its own task list. “Days from event” sets the default due date (−13 means 13 days before). New events use these norms. Existing events are not changed.</div></div>
  <div class="row"><select id="tplt" onchange="tplType=this.value;render()" style="width:auto">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${k===tplType?'selected':''}>${v.label}</option>`).join('')}</select><span class="faint">${rows.length} tasks · starts ${Math.abs(Math.min(...rows.map(r=>r.o)))} days before</span><div style="flex:1"></div><button class="btn pri" onclick="addTplRow()">${ic('plus')}Add task</button></div>
  <div class="tbl-wrap"><table><thead><tr><th>Days from event</th><th>Activity</th><th>Department</th><th>Collateral</th><th>Lead</th><th>Support</th><th></th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><input type="number" id="to-${r.id}" value="${r.o}" style="width:80px" onchange="tplSet('${r.id}','o',+this.value)"></td>
   <td><input type="text" id="tt-${r.id}" value="${esc(r.t)}" style="min-width:220px" onchange="tplSet('${r.id}','t',this.value)"></td>
   <td><select id="td-${r.id}" onchange="tplSet('${r.id}','dept',this.value)">${DEPTS.map(d=>`<option ${d===r.dept?'selected':''}>${d}</option>`).join('')}</select></td>
   <td><input type="text" id="tc-${r.id}" value="${esc(r.col)}" style="width:140px" onchange="tplSet('${r.id}','col',this.value)"></td>
   <td><select id="tl-${r.id}" onchange="tplSet('${r.id}','l1',this.value)">${TEAM.map(d=>`<option ${d===r.l1?'selected':''}>${d}</option>`).join('')}</select></td>
   <td><select id="tl2-${r.id}" onchange="tplSet('${r.id}','l2',this.value)"><option value="">—</option>${TEAM.map(d=>`<option ${d===r.l2?'selected':''}>${d}</option>`).join('')}</select></td>
   <td><button class="btn ghost sm" onclick="S.tpl[tplType]=S.tpl[tplType].filter(x=>x.id!=='${r.id}');save();render()">Remove</button></td></tr>`).join('')}
  </tbody></table></div>`;
};
function tplSet(id,k,v){S.tpl[tplType].find(r=>r.id===id)[k]=v;save();if(k==='o')render()}
function addTplRow(){S.tpl[tplType].push({id:uid(),t:'New task',dept:DEPTS[0],col:'',x:'External',l1:'Shweta',l2:'',o:-7});save();render()}

/* ---------- modal / toast / render ---------- */
const $=id=>document.getElementById(id);
function modal(html,wide){closeModal();const d=document.createElement('div');d.className='scrim';d.id='scrim';d.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div>`;d.onclick=e=>{if(e.target===d)closeModal()};document.body.appendChild(d);const f=d.querySelector('input,select,textarea');if(f)f.focus()}
function closeModal(){const m=$('scrim');if(m)m.remove()}
let tt;function toast(m){let el=$('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el)}el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2200)}
function resetDemo(){try{localStorage.removeItem(KEY)}catch(e){}seed();closeModal();render();toast('Sample data restored')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const CRUMB={home:'Home',events:'Events',event:'Events',calendar:'Calendar',expenses:'Expenses & vendors',budget:'Budget',ideas:'Idea Bank',moments:'Our Moments',library:'Library',guidelines:'Creative guidelines',templates:'Templates'};
function render(){
  document.documentElement.lang=S.lang==='gu'?'gu':'en';
  if(S.view==='submit'){$('root').innerHTML=V.submit();return}
  const v=V[S.view]?S.view:'home';
  $('root').innerHTML=shell(V[v](), v==='event'?esc((evById(S.ev)||{}).name||''):t(CRUMB[v]));
}
load();
if(location.hash.replace('#','')==='submit') S.view='submit';
else if(S.view==='submit') S.view='home';
render();
</script>
